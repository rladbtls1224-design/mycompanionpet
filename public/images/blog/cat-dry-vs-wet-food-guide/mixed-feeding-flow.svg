<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>혼합 급여는 하루 열량의 배분</title><desc id='desc'>건식과 습식의 하루 급여표를 그대로 더하지 않기. 처방식을 먹는 경우 혼합 전 담당 수의사와 확인하세요.</desc><rect width='1200' height='675' rx='24' fill='#faf0ed'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#ab604b'>혼합 급여는 하루 열량의 배분</text><text x='56' y='126' font-size='25' fill='#40525a'>건식과 습식의 하루 급여표를 그대로 더하지 않기</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#ab604b'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>각 제품의 단위 확인</text><text x='159' y='257' font-size='24' fill='#40525a'>건식 kcal/g · 습식 kcal/캔</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#ab604b'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>총량 안에서 나누기</text><text x='159' y='389' font-size='24' fill='#40525a'>기존 열량에 습식을 더하면 합계가 늘어남</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#ab604b'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>실제 섭취 확인</text><text x='159' y='521' font-size='24' fill='#40525a'>제공량과 남긴 양 · 간식까지 기록</text><text x='56' y='628' font-size='21' fill='#40525a'>처방식을 먹는 경우 혼합 전 담당 수의사와 확인하세요.</text></g></svg>