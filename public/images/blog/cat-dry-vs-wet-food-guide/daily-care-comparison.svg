<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>건식과 습식의 일상 관리</title><desc id='desc'>매일 실행할 수 있는 급여 환경을 먼저 생각하세요. 제품별 구체적인 보관과 급여 안내를 우선하세요.</desc><rect width='1200' height='675' rx='24' fill='#edf5f3'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#2e7266'>건식과 습식의 일상 관리</text><text x='56' y='126' font-size='25' fill='#40525a'>매일 실행할 수 있는 급여 환경을 먼저 생각하세요</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#2e7266'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>건식 관리</text><text x='159' y='257' font-size='24' fill='#40525a'>원봉투 밀봉 · 건조한 보관 · 실제 g 계량</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#2e7266'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>습식 관리</text><text x='159' y='389' font-size='24' fill='#40525a'>필요한 양만 분할 · 남은 분량 냉장</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#2e7266'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>공통 관리</text><text x='159' y='521' font-size='24' fill='#40525a'>완전균형식 확인 · 신선한 물 · 먹은 양 기록</text><text x='56' y='628' font-size='21' fill='#40525a'>제품별 구체적인 보관과 급여 안내를 우선하세요.</text></g></svg>