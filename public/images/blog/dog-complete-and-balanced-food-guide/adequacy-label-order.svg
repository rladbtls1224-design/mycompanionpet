<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">강아지 주식 사료 라벨 읽는 순서</title>
  <desc id="desc">대상 동물, 생활 단계, 영양 적합성 문구, 열량과 급여 안내를 순서대로 확인합니다.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f7f3"/>
  <g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#193c35">
    <text x="70" y="92" font-size="40" font-weight="700">주식 사료, 뒷면에서 확인할 네 가지</text>
    <text x="70" y="143" font-size="23" fill="#526760">상품명보다 제품의 용도와 적용 대상을 먼저 읽으세요.</text>
    <g fill="#fff" stroke="#cadbd1" stroke-width="2">
      <rect x="70" y="200" width="510" height="155" rx="20"/>
      <rect x="620" y="200" width="510" height="155" rx="20"/>
      <rect x="70" y="385" width="510" height="155" rx="20"/>
      <rect x="620" y="385" width="510" height="155" rx="20"/>
    </g>
    <text x="100" y="251" font-size="29" font-weight="700">1  대상 동물</text>
    <text x="100" y="301" font-size="23">강아지용 제품인지 확인</text>
    <text x="650" y="251" font-size="29" font-weight="700">2  생활 단계</text>
    <text x="650" y="301" font-size="23">성장기 · 성견기와 적용 범위</text>
    <text x="100" y="436" font-size="29" font-weight="700">3  영양 적합성</text>
    <text x="100" y="486" font-size="23">주식인지, 보조 급여용인지 구분</text>
    <text x="650" y="436" font-size="29" font-weight="700">4  열량 · 급여 안내</text>
    <text x="650" y="486" font-size="23">실제 하루량과 추가 음식 계산</text>
    <text x="70" y="610" font-size="23" fill="#526760">표시가 모호하면 제품명과 포장 사진을 준비해 제조사에 문의하세요.</text>
  </g>
</svg>
