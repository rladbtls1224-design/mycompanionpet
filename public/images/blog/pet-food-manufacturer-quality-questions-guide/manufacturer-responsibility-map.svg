<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#edf1f5"/><g font-family="Malgun Gothic, sans-serif" fill="#303f49"><text x="60" y="78" font-size="37" font-weight="700">사료 제조사 확인: 역할과 책임을 나눠 묻기</text><text x="60" y="123" font-size="24">같은 회사가 맡을 수도, 서로 다른 회사가 맡을 수도 있습니다.</text><rect x="60" y="160" width="1080" height="108" rx="18" fill="white"/><text x="90" y="204" font-size="29" font-weight="700">영양 설계</text><text x="90" y="244" font-size="24">누가 배합을 설계하고 변경을 검토하나요?</text><rect x="60" y="290" width="1080" height="108" rx="18" fill="white"/><text x="90" y="334" font-size="29" font-weight="700">생산 · 품질관리</text><text x="90" y="374" font-size="24">누가 만들고, 누가 검사 결과를 관리하나요?</text><rect x="60" y="420" width="1080" height="108" rx="18" fill="white"/><text x="90" y="464" font-size="29" font-weight="700">국내 문의 · 수입 · 판매</text><text x="90" y="504" font-size="24">제품 자료와 품질 이상 접수는 어디로 하나요?</text><text x="60" y="615" font-size="23">공장 소유 여부 하나로 제품 품질을 판정하지 않습니다.</text></g></svg>