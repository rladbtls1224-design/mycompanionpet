<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f5eee5"/><g font-family="Malgun Gothic, sans-serif" fill="#303f49"><text x="60" y="78" font-size="37" font-weight="700">제조사 답변 기록: 설명과 확인된 근거 구분</text><text x="60" y="123" font-size="24">제품명 · 맛 · 제형 · 판매 국가부터 적어 두세요.</text><rect x="60" y="160" width="1080" height="108" rx="18" fill="white"/><text x="90" y="204" font-size="29" font-weight="700">질문과 답변 원문</text><text x="90" y="244" font-size="24">받은 설명을 그대로 보관하고 내 해석과 구분</text><rect x="60" y="290" width="1080" height="108" rx="18" fill="white"/><text x="90" y="334" font-size="29" font-weight="700">근거와 적용 범위</text><text x="90" y="374" font-size="24">포장 문구 · 분석 자료 · 시험한 제품과 대상</text><rect x="60" y="420" width="1080" height="108" rx="18" fill="white"/><text x="90" y="464" font-size="29" font-weight="700">날짜와 미확인 정보</text><text x="90" y="504" font-size="24">자료 기준일 · 답변일 · 다시 물어볼 항목</text><text x="60" y="615" font-size="23">답변이 없는 항목은 추정으로 채우지 않습니다.</text></g></svg>