<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f2e8"/><g font-family="Malgun Gothic, sans-serif" fill="#3c4032"><text x="60" y="85" font-size="38" font-weight="700">저지방 식단 검토: 사료 밖의 음식도 기록</text><rect x="60" y="125" width="1080" height="90" rx="14" fill="white"/><circle cx="100" cy="170" r="22" fill="#66816a"/><text x="93" y="179" font-size="25" fill="white">1</text><text x="145" y="164" font-size="28" font-weight="700">주식 사료</text><text x="520" y="177" font-size="25">제품 분석 자료와 실제 먹은 양</text><rect x="60" y="235" width="1080" height="90" rx="14" fill="white"/><circle cx="100" cy="280" r="22" fill="#66816a"/><text x="93" y="289" font-size="25" fill="white">2</text><text x="145" y="274" font-size="28" font-weight="700">간식 · 복약용 음식</text><text x="520" y="287" font-size="25">종류와 양, 성분표 사진</text><rect x="60" y="345" width="1080" height="90" rx="14" fill="white"/><circle cx="100" cy="390" r="22" fill="#66816a"/><text x="93" y="399" font-size="25" fill="white">3</text><text x="145" y="384" font-size="28" font-weight="700">토핑 · 오일 보충제</text><text x="520" y="397" font-size="25">하루 사용량과 제품 정보</text><rect x="60" y="455" width="1080" height="90" rx="14" fill="white"/><circle cx="100" cy="500" r="22" fill="#66816a"/><text x="93" y="509" font-size="25" fill="white">4</text><text x="145" y="494" font-size="28" font-weight="700">상담 기록</text><text x="520" y="507" font-size="25">식단 목적, 허용 음식, 변화 관찰</text><text x="60" y="615" font-size="24">질환이 있으면 계산표만으로 처방 식단을 바꾸지 마세요.</text></g></svg>