<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#eef2e9"/><g font-family="Malgun Gothic, sans-serif" fill="#294235"><text x="60" y="85" font-size="38" font-weight="700">조지방 수치: 자료의 종류를 확인하세요</text><text x="60" y="130" font-size="25">최소 보증치는 실제 평균이나 상한선이 아닙니다.</text><rect x="60" y="185" width="345" height="330" rx="18" fill="#fff"/><text x="83" y="250" font-size="30" font-weight="700">최소 보증치</text><text x="83" y="317" font-size="22">이 수치 이상이라는 보증</text><text x="83" y="366" font-size="22">예: 조지방 8% 이상</text><rect x="425" y="185" width="345" height="330" rx="18" fill="#fff"/><text x="448" y="250" font-size="30" font-weight="700">대표 분석값</text><text x="448" y="317" font-size="22">제품 비교에 활용하는 자료</text><text x="448" y="366" font-size="22">생산분마다 차이 가능</text><rect x="790" y="185" width="345" height="330" rx="18" fill="#fff"/><text x="813" y="250" font-size="30" font-weight="700">상한 관리 정보</text><text x="813" y="317" font-size="22">제조사에 제공 여부 문의</text><text x="813" y="366" font-size="22">엄격한 제한은 진료 상담</text><text x="60" y="595" font-size="25">비교할 때는 제품 · 수분 기준 · 열량 · 자료 날짜도 맞춥니다.</text></g></svg>