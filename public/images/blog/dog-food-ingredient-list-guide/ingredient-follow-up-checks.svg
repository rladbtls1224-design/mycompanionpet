<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">원재료 목록 다음에 확인할 정보</title>
  <desc id="desc">주식과 생활 단계 적합성, 하루 열량, 제조사의 영양과 품질 관리, 강아지의 실제 섭취와 반응을 확인합니다.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f7ef"/>
  <g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#334b2b">
    <text x="70" y="92" font-size="40" font-weight="700">원료 목록을 읽은 뒤, 네 가지 질문</text>
    <g fill="#fff" stroke="#c9d7c0" stroke-width="2"><rect x="70" y="170" width="510" height="160" rx="20"/><rect x="620" y="170" width="510" height="160" rx="20"/><rect x="70" y="360" width="510" height="160" rx="20"/><rect x="620" y="360" width="510" height="160" rx="20"/></g>
    <text x="100" y="228" font-size="28" font-weight="700">주식 · 생활 단계</text><text x="100" y="280" font-size="23">현재 강아지에게 적용되나요?</text>
    <text x="650" y="228" font-size="28" font-weight="700">하루 열량</text><text x="650" y="280" font-size="23">실제로 몇 g을 먹이나요?</text>
    <text x="100" y="418" font-size="28" font-weight="700">제조사 정보</text><text x="100" y="470" font-size="23">영양 설계 · 분석 · 품질 관리</text>
    <text x="650" y="418" font-size="28" font-weight="700">개별 강아지</text><text x="650" y="470" font-size="23">섭취 · 체형 · 변화를 기록했나요?</text>
    <text x="70" y="598" font-size="24" fill="#5f7356">궁금한 원료는 이름만으로 판단하기보다 제품 자료로 확인하세요.</text>
  </g>
</svg>
