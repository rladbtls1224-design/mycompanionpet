<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>사료 비교 노트에 적을 네 가지</title><desc id='desc'>앞면 홍보 문구와 영양 정보를 구분하세요. 원재료 이름 하나보다 식단의 목적과 실제 섭취를 함께 봅니다.</desc><rect width='1200' height='675' rx='24' fill='#f5f0f8'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#74508b'>사료 비교 노트에 적을 네 가지</text><text x='56' y='126' font-size='25' fill='#40525a'>앞면 홍보 문구와 영양 정보를 구분하세요</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#74508b'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>① 주식 여부 + ② 원료</text><text x='159' y='257' font-size='24' fill='#40525a'>생활 단계와 확인해야 할 전체 원료 기록</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#74508b'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>③ 실제 열량</text><text x='159' y='389' font-size='24' fill='#40525a'>kcal/kg를 kcal/g으로 바꾸어 분량 비교</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#74508b'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>④ 제조사 질문</text><text x='159' y='521' font-size='24' fill='#40525a'>공개되지 않은 영양 분석과 적합성 문의</text><text x='56' y='628' font-size='21' fill='#40525a'>원재료 이름 하나보다 식단의 목적과 실제 섭취를 함께 봅니다.</text></g></svg>