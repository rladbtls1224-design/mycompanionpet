<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>원료 중량과 수분을 구분하기</title><desc id='desc'>실제 배합비가 아닌 수분 차이를 설명하는 예시. 원재료 순위만으로 제품의 고기 함량을 역산하지 마세요.</desc><rect width='1200' height='675' rx='24' fill='#f0f4f7'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#3a617d'>원료 중량과 수분을 구분하기</text><text x='56' y='126' font-size='25' fill='#40525a'>실제 배합비가 아닌 수분 차이를 설명하는 예시</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#3a617d'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>가상 생육 40g</text><text x='159' y='257' font-size='24' fill='#40525a'>수분 75%라면 수분을 제외한 양은 10g</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#3a617d'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>가상 건조 원료 20g</text><text x='159' y='389' font-size='24' fill='#40525a'>수분 10%라면 수분을 제외한 양은 18g</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#3a617d'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>해석의 한계</text><text x='159' y='521' font-size='24' fill='#40525a'>이 수치는 단백질량·품질·소화율이 아닙니다</text><text x='56' y='628' font-size='21' fill='#40525a'>원재료 순위만으로 제품의 고기 함량을 역산하지 마세요.</text></g></svg>