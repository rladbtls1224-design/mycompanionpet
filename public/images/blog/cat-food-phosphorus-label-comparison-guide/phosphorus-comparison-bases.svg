<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f1f5f4"/><g font-family="Malgun Gothic, sans-serif" fill="#193d3c"><text x="64" y="93" font-size="38" font-weight="700">인 함량: 비교 기준부터 맞추세요</text><rect x="60" y="135" width="1080" height="112" rx="16" fill="white"/><text x="90" y="180" font-size="29" font-weight="700">제품 그대로 %</text><text x="90" y="219" font-size="24">수분을 포함한 제품 무게 기준</text><rect x="60" y="273" width="1080" height="112" rx="16" fill="white"/><text x="90" y="318" font-size="29" font-weight="700">건물 기준 %</text><text x="90" y="357" font-size="24">수분을 제외한 고형분 무게 기준</text><rect x="60" y="411" width="1080" height="112" rx="16" fill="white"/><text x="90" y="456" font-size="29" font-weight="700">mg/100kcal</text><text x="90" y="495" font-size="24">같은 열량을 먹을 때의 인 함량</text><text x="64" y="625" font-size="23">최소 보증치와 평균 분석치는 구분해서 비교합니다.</text></g></svg>