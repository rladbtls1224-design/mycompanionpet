<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f1f5f4"/><g font-family="Malgun Gothic, sans-serif" fill="#193d3c"><text x="64" y="93" font-size="38" font-weight="700">계산하기 전 확인 순서</text><rect x="60" y="135" width="1080" height="112" rx="16" fill="white"/><text x="90" y="180" font-size="29" font-weight="700">1. 수치의 종류</text><text x="90" y="219" font-size="24">최소 · 최대 · 평균 중 무엇인지 확인</text><rect x="60" y="273" width="1080" height="112" rx="16" fill="white"/><text x="90" y="318" font-size="29" font-weight="700">2. 표시 기준과 단위</text><text x="90" y="357" font-size="24">제품 그대로 · 건물 기준 / % · mg</text><rect x="60" y="411" width="1080" height="112" rx="16" fill="white"/><text x="90" y="456" font-size="29" font-weight="700">3. 같은 제품의 열량</text><text x="90" y="495" font-size="24">제품명 · 판매 국가 · 자료 기준일도 대조</text><text x="64" y="625" font-size="23">확인되지 않은 정보는 추정하지 말고 제조사에 문의하세요.</text></g></svg>