<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>사료 개봉일과 보관 이력 남기기</title><desc id='desc'>보관 온도와 개봉 후 사용 기한은 별도 확인. 냄새가 정상이어도 보관 이력이 불명확하면 주의하세요.</desc><rect width='1200' height='675' rx='24' fill='#f2f5ec'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#617445'>사료 개봉일과 보관 이력 남기기</text><text x='56' y='126' font-size='25' fill='#40525a'>보관 온도와 개봉 후 사용 기한은 별도 확인</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#617445'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>개봉할 때</text><text x='159' y='257' font-size='24' fill='#40525a'>제품명 · 제조번호 · 개봉일을 기록</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#617445'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>건식</text><text x='159' y='389' font-size='24' fill='#40525a'>원봉투 밀봉 · 서늘하고 건조한 곳</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#617445'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>습식</text><text x='159' y='521' font-size='24' fill='#40525a'>남은 양을 즉시 덮어 냉장 · 제품 기한 확인</text><text x='56' y='628' font-size='21' fill='#40525a'>냄새가 정상이어도 보관 이력이 불명확하면 주의하세요.</text></g></svg>