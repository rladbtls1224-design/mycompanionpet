<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>고양이 체중 관리 사료 선택</title><desc id='desc'>제품 이름보다 개별 계획과 실제 섭취를 확인. 굶기거나 기존 사료를 갑자기 크게 제한하지 마세요.</desc><rect width='1200' height='675' rx='24' fill='#eff2f8'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#4e648f'>고양이 체중 관리 사료 선택</text><text x='56' y='126' font-size='25' fill='#40525a'>제품 이름보다 개별 계획과 실제 섭취를 확인</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#4e648f'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>시작 전 평가</text><text x='159' y='257' font-size='24' fill='#40525a'>체중 · 체형 · 근육 · 건강 상태를 상담</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#4e648f'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>식단 계획</text><text x='159' y='389' font-size='24' fill='#40525a'>주식 적합성 · 열량 · 영양 설계를 함께 확인</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#4e648f'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>지속적인 재평가</text><text x='159' y='521' font-size='24' fill='#40525a'>실제 먹은 양과 체중 변화를 기록</text><text x='56' y='628' font-size='21' fill='#40525a'>굶기거나 기존 사료를 갑자기 크게 제한하지 마세요.</text></g></svg>