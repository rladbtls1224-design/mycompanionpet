<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>주간 체중 변화율 계산 예시</title><desc id='desc'>아래 수치는 개별 고양이의 목표 속도가 아닙니다. 체중 감소가 빨라지거나 식사를 거부하면 병원에 연락하세요.</desc><rect width='1200' height='675' rx='24' fill='#faf3ef'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#9c6549'>주간 체중 변화율 계산 예시</text><text x='56' y='126' font-size='25' fill='#40525a'>아래 수치는 개별 고양이의 목표 속도가 아닙니다</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#9c6549'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>처음 6.00kg → 이후 5.94kg</text><text x='159' y='257' font-size='24' fill='#40525a'>차이 0.06kg = 60g 감소</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#9c6549'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>변화율</text><text x='159' y='389' font-size='24' fill='#40525a'>0.06 ÷ 6.00 × 100 = 1%</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#9c6549'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>체중과 함께 기록</text><text x='159' y='521' font-size='24' fill='#40525a'>식사량 · 활력 · 배변 · 근육 변화</text><text x='56' y='628' font-size='21' fill='#40525a'>체중 감소가 빨라지거나 식사를 거부하면 병원에 연락하세요.</text></g></svg>