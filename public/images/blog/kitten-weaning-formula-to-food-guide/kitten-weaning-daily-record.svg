<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#eef3ed"/><g font-family="Malgun Gothic, sans-serif" fill="#493f3b"><text x="60" y="88" font-size="37" font-weight="700">이유식 기록: 그릇이 빈 것만 보지 마세요</text><rect x="60" y="145" width="1080" height="112" rx="18" fill="white"/><text x="90" y="191" font-size="29" font-weight="700">분유와 주식</text><text x="90" y="232" font-size="24">제품 · 준비량 · 먹은 양 · 남김과 흘림</text><rect x="60" y="280" width="1080" height="112" rx="18" fill="white"/><text x="90" y="326" font-size="29" font-weight="700">매일의 성장 흐름</text><text x="90" y="367" font-size="24">같은 저울과 비슷한 조건으로 체중 기록</text><rect x="60" y="415" width="1080" height="112" rx="18" fill="white"/><text x="90" y="461" font-size="29" font-weight="700">몸 상태와 상담 신호</text><text x="90" y="502" font-size="24">변 · 기력 · 기침과 호흡 변화 관찰</text><text x="60" y="620" font-size="23">먹지 못하거나 체중이 줄고 기력이 약하면 신속히 상담하세요.</text></g></svg>