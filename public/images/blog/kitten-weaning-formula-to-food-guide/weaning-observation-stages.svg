<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fbefe7"/><g font-family="Malgun Gothic, sans-serif" fill="#493f3b"><text x="60" y="88" font-size="37" font-weight="700">새끼 고양이 이유식: 관찰하며 천천히 전환</text><rect x="60" y="145" width="1080" height="112" rx="18" fill="white"/><text x="90" y="191" font-size="29" font-weight="700">접시에서 먹는 연습</text><text x="90" y="232" font-size="24">안정적으로 서고 음식에 관심을 보이는지 확인</text><rect x="60" y="280" width="1080" height="112" rx="18" fill="white"/><text x="90" y="326" font-size="29" font-weight="700">실제 섭취 확인</text><text x="90" y="367" font-size="24">핥기 · 흘림과 삼켜 먹는 양을 구분</text><rect x="60" y="415" width="1080" height="112" rx="18" fill="white"/><text x="90" y="461" font-size="29" font-weight="700">질감 · 보충 조정</text><text x="90" y="502" font-size="24">체중과 주식 섭취를 보며 개별 계획에 따라 조정</text><text x="60" y="620" font-size="23">생후 날짜 하나로 모유나 분유를 갑자기 끊지 마세요.</text></g></svg>