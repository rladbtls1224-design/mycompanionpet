<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>하루 200kcal를 나누는 계산 예시</title><desc id='desc'>개별 권장량이 아닌 가상의 산수 예시입니다. 습식을 추가하면 기존 건식의 열량도 함께 계산합니다.</desc><rect width='1200' height='675' rx='24' fill='#fbf4e8'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#9a672d'>하루 200kcal를 나누는 계산 예시</text><text x='56' y='126' font-size='25' fill='#40525a'>개별 권장량이 아닌 가상의 산수 예시입니다</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#9a672d'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>건식 30g</text><text x='159' y='257' font-size='24' fill='#40525a'>4kcal/g × 30g = 120kcal</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#9a672d'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>주식 습식 1캔</text><text x='159' y='389' font-size='24' fill='#40525a'>한 캔 열량 = 80kcal</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#9a672d'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>하루 합계</text><text x='159' y='521' font-size='24' fill='#40525a'>120 + 80 = 200kcal</text><text x='56' y='628' font-size='21' fill='#40525a'>습식을 추가하면 기존 건식의 열량도 함께 계산합니다.</text></g></svg>