<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675' role='img' aria-labelledby='title desc'><title id='title'>주식캔 라벨 확인 순서</title><desc id='desc'>제품 앞면보다 뒷면의 작은 문구를 읽으세요. 주식 여부가 불명확하면 제조사의 공식 안내를 확인하세요.</desc><rect width='1200' height='675' rx='24' fill='#f3f5ee'/><g font-family='Malgun Gothic, Noto Sans KR, sans-serif'><text x='56' y='80' font-size='42' font-weight='700' fill='#3f644a'>주식캔 라벨 확인 순서</text><text x='56' y='126' font-size='25' fill='#40525a'>제품 앞면보다 뒷면의 작은 문구를 읽으세요</text><rect x='56' y='174' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='231' r='27' fill='#3f644a'/><text x='108' y='240' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>1</text><text x='159' y='217' font-size='27' font-weight='700' fill='#202c31'>대상 동물</text><text x='159' y='257' font-size='24' fill='#40525a'>고양이용 제품인지 실제 포장을 확인</text><rect x='56' y='306' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='363' r='27' fill='#3f644a'/><text x='108' y='372' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>2</text><text x='159' y='349' font-size='27' font-weight='700' fill='#202c31'>생활 단계</text><text x='159' y='389' font-size='24' fill='#40525a'>성장기 · 성묘 유지 · 전연령용을 구분</text><rect x='56' y='438' width='1088' height='114' rx='18' fill='#ffffff'/><circle cx='108' cy='495' r='27' fill='#3f644a'/><text x='108' y='504' text-anchor='middle' font-size='25' fill='#ffffff' font-weight='700'>3</text><text x='159' y='481' font-size='27' font-weight='700' fill='#202c31'>영양 적합성</text><text x='159' y='521' font-size='24' fill='#40525a'>완전균형식과 간식·보조용 표시를 확인</text><text x='56' y='628' font-size='21' fill='#40525a'>주식 여부가 불명확하면 제조사의 공식 안내를 확인하세요.</text></g></svg>