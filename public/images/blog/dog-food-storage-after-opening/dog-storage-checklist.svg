<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">강아지 사료 보관 확인 순서</title>
  <desc id="desc">건사료는 원포장과 로트 정보를 보존하고, 개봉한 습식은 즉시 냉장하거나 폐기하며, 새 봉투를 넣기 전 용기를 씻고 완전히 말립니다.</desc>
  <rect width="1200" height="675" rx="28" fill="#f4f7f5"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#173d33">
    <text x="66" y="92" font-size="25" letter-spacing="2">MYCOMPANIONPET · 보관 체크</text>
    <text x="66" y="156" font-size="44" font-weight="700">새 사료를 담기 전, 세 가지만 확인하세요</text>
    <g transform="translate(66 210)">
      <rect width="340" height="330" rx="22" fill="#fff" stroke="#d4e2dc"/>
      <circle cx="48" cy="52" r="24" fill="#176b52"/>
      <text x="40" y="61" fill="#fff" font-size="25" font-weight="700">1</text>
      <text x="28" y="123" font-size="31" font-weight="700">원포장 보존</text>
      <text x="28" y="176" font-size="24">건사료는 봉투째 밀폐 용기에</text>
      <text x="28" y="217" font-size="24">제품명 · 로트 번호 · 기한</text>
      <text x="28" y="258" font-size="24">개봉일도 함께 기록</text>
    </g>
    <g transform="translate(430 210)">
      <rect width="340" height="330" rx="22" fill="#fff" stroke="#d4e2dc"/>
      <circle cx="48" cy="52" r="24" fill="#176b52"/>
      <text x="40" y="61" fill="#fff" font-size="25" font-weight="700">2</text>
      <text x="28" y="123" font-size="31" font-weight="700">습식은 바로 관리</text>
      <text x="28" y="176" font-size="24">남은 분량은 냉장 또는 폐기</text>
      <text x="28" y="217" font-size="24">개봉 후 기한은 제품별 확인</text>
      <text x="28" y="258" font-size="24">먹던 그릇의 잔량과 구분</text>
    </g>
    <g transform="translate(794 210)">
      <rect width="340" height="330" rx="22" fill="#fff" stroke="#d4e2dc"/>
      <circle cx="48" cy="52" r="24" fill="#176b52"/>
      <text x="40" y="61" fill="#fff" font-size="25" font-weight="700">3</text>
      <text x="28" y="123" font-size="31" font-weight="700">용기는 씻고 말리기</text>
      <text x="28" y="176" font-size="24">새 봉투를 넣기 전 세척</text>
      <text x="28" y="217" font-size="24">물기 · 가루 · 기름기 확인</text>
      <text x="28" y="258" font-size="24">이전 사료에 덧붓지 않기</text>
    </g>
    <text x="66" y="604" font-size="24">이상한 냄새·팽창·누수·이물질이 보이면 급여를 멈추고 제품 정보를 확인하세요.</text>
  </g>
</svg>
